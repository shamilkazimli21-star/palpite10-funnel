<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0A0E1A"
  >

  <meta
    name="description"
    content="Palpite10: análises e palpites de futebol gratuitos."
  >

  <title>Palpite10 | Acesso Grátis</title>

  <!-- Inter -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!--
    Meta Pixel is initialized dynamically by app.js.

    IMPORTANT:
    META_ACCESS_TOKEN is NEVER placed in this file.
    It remains server-side inside Vercel.
  -->

  <style>
    html {
      background: #0A0E1A;
    }

    body {
      margin: 0;
      background: #0A0E1A;
    }

    #app-loading {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #0A0E1A;
      color: #F5F7FA;
      font-family: Inter, sans-serif;
    }

    .loading-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00FF87;
      box-shadow:
        0 0 0 8px rgba(0, 255, 135, 0.08),
        0 0 24px rgba(0, 255, 135, 0.35);
    }
  </style>

  <link
    rel="stylesheet"
    href="/styles.css"
  >
</head>

<body>

  <div id="app-loading" aria-hidden="true">
    <div class="loading-dot"></div>
  </div>

  <main
    id="app"
    class="app"
    aria-live="polite"
  ></main>

  <noscript>
    <div class="noscript">
      <strong>JavaScript é necessário.</strong>
      Ative o JavaScript para acessar o Palpite10.
    </div>
  </noscript>

  <script
    src="/app.js"
    defer
  ></script>

</body>
</html>
